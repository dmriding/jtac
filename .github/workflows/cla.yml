# CLA acceptance and sign-off gate on every pull request. See CLA.md section 10.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  accept:
    runs-on: ubuntu-latest
    if: >-
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read and accept the jtac Contributor Assignment Agreement, version 1.') ||
      github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/dmriding/jtac/blob/main/CLA.md
          path-to-signatures: cla-signatures.json
          # Signatures live on their own branch so the main ruleset never has to admit a bot commit.
          branch: cla-signatures
          allowlist: dmriding,dependabot[bot]
          custom-pr-sign-comment: 'I have read and accept the jtac Contributor Assignment Agreement, version 1.'
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, read CLA.md and
            post this comment, exactly: `I have read and accept the jtac Contributor
            Assignment Agreement, version 1.`
          custom-allsigned-prcomment: 'All contributors have accepted the CLA.'
          lock-pullrequest-aftermerge: false

  signoff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      # The base branch is checked out, never the pull request; its commits are only read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: every commit carries a Signed-off-by trailer
        env:
          PR: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          git fetch -q --no-tags origin "refs/pull/${PR}/head"
          commits=$(git rev-list "${PR_BASE}..${PR_HEAD}")
          missing=
          for c in $commits; do
            if git show -s --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <.+@.+>'; then continue; fi
            # An unsigned merge passes only as the clean merge of its two parents: nothing of its own (#74).
            set -- $(git show -s --format=%P "$c")
            if [ $# -eq 2 ] && clean=$(git merge-tree --write-tree "$1" "$2" 2>/dev/null) \
               && [ "$clean" = "$(git show -s --format=%T "$c")" ]; then continue; fi
            missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "Commits without a Signed-off-by trailer (CLA.md section 10):"
            for c in $missing; do echo "$c"; done
            echo 'Fix: git rebase --signoff origin/main, then force-push your branch.'
            exit 1
          fi
