# A release is a signed v* tag on main (docs/RELEASING.md). The version check runs alone first,
# then the full ci.yml gates on the tagged commit; a red job means no release and the tag is spent.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gates:
    needs: version
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - run: sh scripts/release-check.sh "$GITHUB_REF_NAME"

  build:
    needs: [gates, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: one static Linux binary instead of a glibc floor set by the runner image.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p jtac --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -eu
          name="jtac-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp LICENSE.md "dist/$name/"
          if [ "${{ matrix.os }}" = windows-latest ]; then
            cp "target/${{ matrix.target }}/release/jtac.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/jtac" "dist/$name/"
            (cd dist && tar czf "$name.tar.gz" "$name")
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: jtac-ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # `jtac release --sums` signs these digests into the attestation install.sh checks (DESIGN.md decision 39).
      - name: checksums
        run: |
          set -eu
          (cd dist && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
      # The release gate (DESIGN.md section 16.3): every commit since the previous attestation under
      # a trusted root and the first-parent line under CI's, attested by the CI key with the
      # checksums inside, or no release. The musl build just made is the jtac that judges.
      - name: attest
        env:
          KEY: ${{ secrets.JTAC_CI_KEY }}
        run: |
          set -euo pipefail
          name="jtac-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl"
          tar xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          git fetch -q origin '+refs/jtac/*:refs/jtac/*'
          keyfile="$RUNNER_TEMP/jtac-ci-key"
          trap 'rm -f "$keyfile"' EXIT
          umask 077
          printf '%s\n' "$KEY" > "$keyfile"
          git config user.email jtac-ci@users.noreply.github.com
          git config jtac.signingkey "$keyfile"
          "$RUNNER_TEMP/$name/jtac" release "$GITHUB_REF_NAME" --sums SHA256SUMS --require-ci --push origin | tee -a "$GITHUB_STEP_SUMMARY"
          git cat-file blob "refs/jtac/releases/$GITHUB_REF_NAME:release.json" > jtac-release.json
          git cat-file blob "refs/jtac/releases/$GITHUB_REF_NAME:release.sig" > jtac-release.sig
      - name: release notes from the changelog section
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "jtac $GITHUB_REF_NAME" --notes-file notes.md dist/* SHA256SUMS jtac-release.json jtac-release.sig
