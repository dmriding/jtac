# The jtac CI gate on jtac itself: `jtac ci` on every pull request, and when `ci` completes
# for a push to `main` a CI-signed root on every merged pull request (DESIGN.md section 15.2,
# decision 67). The action and the binary are this tree's, so a change to either gates
# itself before a release carries it (docs/CI.md).
name: jtac

on:
  pull_request:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  jtac:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p jtac
      - uses: ./
        with:
          binary: target/debug/jtac

  # The `if` keeps a pull request's run out of the environment; the action's doorbell is
  # the fence, on the branch it fetches. The checkout is `main`'s tip, never the run's commit.
  root:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: jtac-ci
    concurrency:
      group: jtac-root-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p jtac
      - uses: ./
        with:
          binary: target/debug/jtac
          key: ${{ secrets.JTAC_CI_KEY }}
