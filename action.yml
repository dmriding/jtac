# The jtac CI gate (DESIGN.md sections 15 and 15.2, decisions 43 and 67): `jtac ci` on a pull
# request; on a push to the default branch, or when a workflow its policy reads completes
# there, the merge root when the forge names the tip as a pull request's merge, else `jtac ci`
# from the old tip. The workflow supplies the checkout, the environment, the secret and the
# permissions (docs/CI.md); `adapter/github/` holds the default-branch job.
name: jtac
description: Provenance gate for AI-written code. Verifies the roots a pull request pushed and signs the merge root.

inputs:
  key:
    description: The CI private key, from the environment secret. The push job alone.
    required: false
    default: ""
  principal:
    description: user.email of the roots CI signs, the principal of its line in .jtac/signers.
    required: false
    default: jtac-ci@users.noreply.github.com
  require-local-root:
    description: Fail a pull request whose head has no root this gate can compare.
    required: false
    default: "false"
  binary:
    description: A built jtac to run instead of the pinned release.
    required: false
    default: ""
  remote:
    description: The remote roots are fetched from and the merge root is pushed to.
    required: false
    default: origin

runs:
  using: composite
  steps:
    # Any other event would run no gate and pass; pull_request_target would also check out
    # the pull request head with the repository's own secrets in reach.
    - name: event
      shell: bash
      run: |
        set -euo pipefail
        case "$GITHUB_EVENT_NAME" in
          pull_request|push|workflow_run) ;;
          *)
            printf '%s\n' "jtac: no gate runs on a $GITHUB_EVENT_NAME event." \
              "The action judges a pull request and a push to the default branch, at the push or when a workflow its policy reads completes; any other event would pass without judging anything, and pull_request_target hands the pull request head the repository's secrets." \
              "Trigger the workflow on pull_request and on push or workflow_run alone, as the one jtac init --ci github writes does." >&2
            exit 2 ;;
        esac

    # Copies, since the default-branch job checks commits out: a binary built in the work
    # tree and a script read from it would change under the job.
    - name: jtac binary
      shell: bash
      env:
        VERSION: v0.2.35
        BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/jtac-bin/jtac"
        if [ -n "$BINARY" ]; then
          mkdir -p "$RUNNER_TEMP/jtac-bin"
          cp "$BINARY" "$bin"
        else
          sh "$GITHUB_ACTION_PATH/install.sh" --to "$RUNNER_TEMP/jtac-bin" --version "$VERSION"
        fi
        "$bin" --version
        rm -rf "$RUNNER_TEMP/jtac-adapter"
        cp -R "$GITHUB_ACTION_PATH/adapter/github" "$RUNNER_TEMP/jtac-adapter"
        echo "JTAC_BIN=$bin" >> "$GITHUB_ENV"
        echo "JTAC_ADAPTER=$RUNNER_TEMP/jtac-adapter" >> "$GITHUB_ENV"

    # Full history for the walk, the roots from the repository the head lives in (a fork's
    # are the fork's), and on a pull request the head itself: the checkout is the merge ref.
    - name: history and roots
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch -q --unshallow "$REMOTE"
        fi
        if [ -n "$HEAD_SHA" ]; then
          git fetch -q "$REMOTE" "+refs/heads/$BASE_REF:refs/remotes/$REMOTE/$BASE_REF" "+refs/pull/$PR/head:refs/remotes/pull/$PR/head"
          git fetch -q --no-tags "${HEAD_REPO:-$REMOTE}" "+refs/jtac/*:refs/jtac/*"
          git checkout -q --detach "$HEAD_SHA"
        else
          git fetch -q "$REMOTE" "+refs/jtac/*:refs/jtac/*"
        fi

    - name: pull request gate
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        BASE_REF: ${{ github.base_ref }}
        REQUIRE: ${{ inputs.require-local-root }}
      run: |
        set -euo pipefail
        flag=""
        if [ "$REQUIRE" = true ]; then flag=--require-local-root; fi
        code=0
        printf '```\n' >> "$GITHUB_STEP_SUMMARY"
        "$JTAC_BIN" ci --base "refs/remotes/$REMOTE/$BASE_REF" $flag | tee -a "$GITHUB_STEP_SUMMARY" || code=$?
        printf '```\n' >> "$GITHUB_STEP_SUMMARY"
        exit "$code"

    # No key here: the key's step starts only when this one rings (decision 67).
    - name: doorbell
      id: bell
      if: github.event_name == 'workflow_run'
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        BRANCH: ${{ github.event.repository.default_branch }}
        RUN_EVENT: ${{ github.event.workflow_run.event }}
        RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      run: bash "$JTAC_ADAPTER/bell.sh"

    - name: merge root
      if: github.event_name == 'push' || steps.bell.outputs.ring == 'true'
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        PRINCIPAL: ${{ inputs.principal }}
        REMOTE: ${{ inputs.remote }}
        BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.event.repository.default_branch }}
        BEFORE: ${{ github.event.before }}
        FORCED: ${{ github.event.forced }}
        RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        GH_TOKEN: ${{ github.token }}
      run: bash "$JTAC_ADAPTER/root.sh"

    # The nodes behind the verdict, for `jtac replay` on a downloaded store.
    - name: evidence store
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: jtac-store-${{ github.job }}
        path: .git/jtac
        if-no-files-found: ignore
        include-hidden-files: true
