[package]
name = "jtac"
description = "Provenance and verification for AI-written code: a local gate with signed evidence that travels with commits."
readme = "../../README.md"
keywords = ["git", "provenance", "code-review", "ai", "attestation"]
categories = ["development-tools", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true

[dependencies]
jtac-core = { workspace = true }
jtac-policy = { workspace = true }
jtac-checks = { workspace = true }
jtac-store = { workspace = true }
jtac-sign = { workspace = true }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
jtac-testkit = { workspace = true }

[lints]
workspace = true
