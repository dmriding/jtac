[package]
name = "jtac-checks"
description = "Check runner: subprocess execution, output capture, caching, diff-integrity checks."
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
jtac-core = { workspace = true }
jtac-policy = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
similar = { version = "3.2.0", default-features = false, features = ["std"] }
regex = "1.13.1"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
jtac-testkit = { workspace = true }
