# cargo deny check. Runs in CI as the `deny` job.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Unpublished workspace crates are skipped; the published `jtac` crate carries the project
# license, so it is allowed by name. Dependencies must be permissive.
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
  "FSL-1.1-ALv2",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between private workspace crates may omit a version; the published
# `jtac` crate may not, so every workspace path entry carries one (docs/RELEASING.md).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
