# cargo deny check. Runs in CI as the `deny` job.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Workspace crates are FSL-1.1-ALv2 and publish = false; dependencies must be permissive.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates report "*"; they are private and exempt.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
