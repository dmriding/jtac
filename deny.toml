# cargo deny check. Runs in CI as the `deny` job.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The unpublished `jtac-testkit` is skipped; the published crates carry the project
# license, so it is allowed by name. Dependencies must be permissive.
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
  "FSL-1.1-ALv2",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A published crate's path dependency needs a version, so every workspace path entry
# carries one but `jtac-testkit`'s: a dev-dependency by path alone (docs/RELEASING.md).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
